x-session-sandbox-environment: &session-sandbox-environment
  EXECUTOR_SOCKET: /run/chat-ds-executor/executor.sock
  EXECUTOR_SOCKET_MODE: "0660"
  EXECUTOR_SOCKET_GID: "65533"
  EXECUTOR_V2_AUTH_TOKEN: ${EXECUTOR_V2_AUTH_TOKEN:-}
  SKILL_EGRESS_POLICY_TOKEN: ${EXECUTOR_V2_AUTH_TOKEN:-}
  EXECUTOR_RUNTIME_PROFILE: session-sandbox-v1
  EXECUTOR_WORKER_UID: "65529"
  EXECUTOR_WORKER_GID: "65529"
  EXECUTOR_ENFORCE_SHARED_STATE_ISOLATION: "1"
  EXECUTOR_EXECUTION_TEMP_ROOT: /run/chatds-executor-work
  EXECUTOR_ALLOWED_REQUEST_KINDS: >-
    runtime_capabilities,process_lease,skill_script,declared_command,session_code,legacy_code
  EXECUTOR_MAX_PROCESS_LEASES: "1"
  EXECUTOR_MAX_PROCESS_LEASES_PER_SCOPE: "1"
  EXECUTOR_MAX_ADDRESS_SPACE_BYTES: "unlimited"
  EXECUTOR_PROCESS_MAX_CPU_SECONDS: "3600"
  # RLIMIT_NPROC is host-real-UID-global across the four containers.  The
  # per-slot cgroup pids_limit below remains the actual hard concurrency bound.
  EXECUTOR_PROCESS_MAX_NPROC: "4096"
  EXECUTOR_PROCESS_MAX_NOFILE: "1024"
  # Policy-v3 budgets are root-run scoped at the proxy, so delegates and
  # retries cannot each reset the disclosure allowance.
  EXECUTOR_EGRESS_MAX_REQUESTS_PER_SCOPE: ${SKILL_EGRESS_MAX_REQUESTS:-2048}
  EXECUTOR_EGRESS_MAX_OUTBOUND_BYTES_PER_SCOPE: ${SKILL_EGRESS_MAX_OUTBOUND_BYTES:-16777216}
  EXECUTOR_EGRESS_MAX_RESPONSE_WIRE_BYTES_PER_SCOPE: ${SKILL_EGRESS_MAX_RESPONSE_WIRE_BYTES:-536870912}
  EXECUTOR_REQUIRE_EGRESS_POLICY_V3: "1"
  SE_OFFLINE: "true"
  SE_AVOID_STATS: "true"
  SE_AVOID_BROWSER_DOWNLOAD: "true"

x-session-sandbox-slot: &session-sandbox-slot
  image: chat_ds-session-sandbox
  build:
    context: ./executor
    dockerfile: Dockerfile.browser-runtime
    target: session-sandbox
  restart: unless-stopped
  depends_on:
    skill-egress-proxy:
      condition: service_healthy
  network_mode: none
  user: "0:0"
  group_add:
    - "65530"
  read_only: true
  pids_limit: 512
  mem_limit: 3g
  cpus: 2.0
  environment: *session-sandbox-environment
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - SETGID
    - SETUID
    - SYS_CHROOT
  security_opt:
    - no-new-privileges:true
    - seccomp:./executor/browser_runtime/seccomp_profile.json
  healthcheck:
    test: ["CMD", "python", "-I", "/app/server.py", "--healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 15s
  tmpfs:
    - /tmp:size=1536m,mode=0755
    - /dev/shm:size=768m,mode=0755
    - /run/chatds-executor-work:size=1536m,mode=0755,exec
  stop_grace_period: 20s

services:

  searxng-valkey:
    profiles:
      - local-search
    image: docker.io/valkey/valkey:9-alpine@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
    container_name: chat_acits_searxng_valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${SEARXNG_VALKEY_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - noeviction
      - --loglevel
      - warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - searxng_valkey_data:/data
    networks:
      - search_net

  searxng:
    profiles:
      - local-search
    # Pinned official image for upstream commit 8456831a (2026-07-09).
    # Keeping the complete SearXNG source tree outside this application repo
    # makes a clean checkout reproducible instead of relying on local files.
    image: docker.io/searxng/searxng:2026.7.9-8456831a0@sha256:a7b2b16eb4d79c2f0f6cff84fab9c41137e4e6dd29a1f64e2d785d27acb5a2e0
    container_name: chat_acits_searxng
    restart: unless-stopped
    depends_on:
      searxng-valkey:
        condition: service_healthy
    environment:
      SEARXNG_PORT: ${SEARXNG_PORT:-8080}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      # Keep the optional profile parseable when local search is disabled,
      # but fail closed at container startup if the profile is enabled
      # without a deployment-owned secret.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_VALKEY_URL: ${SEARXNG_VALKEY_URL:-valkey://searxng-valkey:6379/0}
      # limiter.toml pass-lists the production Harness. This protects the LAN
      # endpoint without throttling the trusted JSON API caller.
      SEARXNG_LIMITER: ${SEARXNG_LIMITER:-true}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$SEARXNG_SECRET" &&
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "${SEARXNG_HOST_BIND:-127.0.0.1}:${SEARXNG_HOST_PORT:-8088}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng_data:/var/cache/searxng
    networks:
      - search_net
    healthcheck:
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - "import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read() == b'OK' else 1)"
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s

  executor:
    <<: *session-sandbox-slot
    container_name: chat_acits_executor
    volumes:
      - executor_socket:/run/chat-ds-executor
      - skill_egress_proxy_socket:/run/chatds-skill-egress:ro

  executor-2:
    <<: *session-sandbox-slot
    container_name: chat_acits_executor_2
    volumes:
      - executor_socket_2:/run/chat-ds-executor
      - skill_egress_proxy_socket:/run/chatds-skill-egress:ro

  executor-3:
    <<: *session-sandbox-slot
    container_name: chat_acits_executor_3
    volumes:
      - executor_socket_3:/run/chat-ds-executor
      - skill_egress_proxy_socket:/run/chatds-skill-egress:ro

  executor-4:
    <<: *session-sandbox-slot
    container_name: chat_acits_executor_4
    volumes:
      - executor_socket_4:/run/chat-ds-executor
      - skill_egress_proxy_socket:/run/chatds-skill-egress:ro

  # The proxy socket directory is owned by the proxy identity. Its setgid
  # bridge group is injected only into the root controller; worker children
  # drop all supplementary groups before exec.
  skill-egress-proxy-socket-init:
    image: chat_ds-skill-egress-proxy
    pull_policy: never
    container_name: chat_acits_skill_egress_proxy_socket_init
    restart: "no"
    network_mode: none
    user: "0:0"
    group_add:
      - "65530"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # The proxy-only trust directory is deliberately 0700 and owned by the
      # runtime proxy UID. The root initializer needs DAC_OVERRIDE to inspect
      # its expected files on restart. A 1/2-file first-generation prefix is
      # admitted only while no public trust member exists; the proxy then
      # validates ownership/type and regenerates it crash-safely.
      - DAC_OVERRIDE
      - FOWNER
    # This trusted, networkless initializer executes only the fixed command
    # below. The current host rejects NNP combined with any seccomp filter;
    # retain Docker's default seccomp and the narrow capability set instead.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -d /run/chatds-skill-egress &&
        test ! -L /run/chatds-skill-egress &&
        test -d /var/lib/chatds-skill-egress-private &&
        test ! -L /var/lib/chatds-skill-egress-private &&
        private_count=0 &&
        for name in ca.key ca.pem leaf.key; do
          if test -e "/var/lib/chatds-skill-egress-private/$$name" ||
             test -L "/var/lib/chatds-skill-egress-private/$$name"; then
            private_count=$$((private_count + 1));
          fi;
        done &&
        if test "$$private_count" -lt 3; then
          test ! -e /run/chatds-skill-egress/generation.json &&
          test ! -L /run/chatds-skill-egress/generation.json &&
          if test -e /run/chatds-skill-egress/ca.pem ||
             test -L /run/chatds-skill-egress/ca.pem ||
             test -e /run/chatds-skill-egress/leaf.spki ||
            test -L /run/chatds-skill-egress/leaf.spki; then
            test "$$private_count" -eq 0 &&
            test "$$SKILL_EGRESS_ALLOW_LEGACY_TRUST_MIGRATION" = 1 &&
            rm -f /run/chatds-skill-egress/ca.pem /run/chatds-skill-egress/leaf.spki;
          fi;
        fi &&
        chown 65531:65530 /run/chatds-skill-egress &&
        chmod 2710 /run/chatds-skill-egress &&
        chown 65531:65531 /var/lib/chatds-skill-egress-private &&
        chmod 0700 /var/lib/chatds-skill-egress-private
    environment:
      # Set to 1 only for the drained, one-time migration from the legacy
      # public-only trust volume. A normal restart must leave this at 0.
      SKILL_EGRESS_ALLOW_LEGACY_TRUST_MIGRATION: >-
        ${SKILL_EGRESS_ALLOW_LEGACY_TRUST_MIGRATION:-0}
    volumes:
      - skill_egress_proxy_socket:/run/chatds-skill-egress
      - skill_egress_proxy_private:/var/lib/chatds-skill-egress-private

  # The policy proxy is the only session-sandbox component with a network
  # attachment. It validates and pins every destination before forwarding.
  skill-egress-proxy:
    image: chat_ds-skill-egress-proxy
    build:
      context: ./skill_egress_proxy
    container_name: chat_acits_skill_egress_proxy
    restart: unless-stopped
    depends_on:
      skill-egress-proxy-socket-init:
        condition: service_completed_successfully
    init: true
    user: "65531:65531"
    group_add:
      - "65530"
    read_only: true
    pids_limit: 96
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    # The image has no setuid/setgid files or file capabilities and the proxy
    # runs non-root with every capability dropped. Keep Docker's default
    # seccomp; this host cannot stack a seccomp filter with NNP (errno 524).
    environment:
      SKILL_EGRESS_SOCKET_PATH: /run/chatds-skill-egress/proxy.sock
      SKILL_EGRESS_PRIVATE_TRUST_DIRECTORY: >-
        /var/lib/chatds-skill-egress-private
      SKILL_EGRESS_POLICY_TOKEN: ${EXECUTOR_V2_AUTH_TOKEN:-}
      SKILL_EGRESS_PUBLIC_PORTS: ${SKILL_EGRESS_PUBLIC_PORTS:-80,443}
      # Private egress needs all three independent gates: the current user
      # turn, this deployment allowlist, and the executor-signed run policy.
      # Hostname origins additionally require every DNS answer to remain
      # inside the configured CIDRs; literal IP origins are pinned exactly.
      # A deployment profile is not, by itself, a network grant. Keep the
      # private Claude Provider origins in a second explicit allowlist and
      # merge them only at the trusted proxy boundary. Signed Turn policy must
      # still name the exact selected origin and /v1/messages request.
      SKILL_EGRESS_PRIVATE_ORIGIN_ALLOWLIST: >-
        ${BROWSER_PRIVATE_ORIGIN_ALLOWLIST:-},${CLAUDE_PROVIDER_PRIVATE_ORIGIN_ALLOWLIST:-http://10.10.132.2:1025,http://10.10.132.128:1025}
      SKILL_EGRESS_PRIVATE_CIDR_ALLOWLIST: ${SKILL_EGRESS_PRIVATE_CIDR_ALLOWLIST:-}
      # Preferred certificate exceptions are scoped to canonical HTTPS
      # origins as JSON.  The legacy pin list is only consulted after the
      # signed run origin, deployment private-origin and address/CIDR gates
      # have all succeeded; neither setting grants destination authority.
      SKILL_EGRESS_UPSTREAM_TLS_SPKI_PINS: ${SKILL_EGRESS_UPSTREAM_TLS_SPKI_PINS:-}
      BROWSER_TLS_SPKI_ALLOWLIST: ${BROWSER_TLS_SPKI_ALLOWLIST:-}
      SKILL_EGRESS_CONNECT_TIMEOUT_SECONDS: ${SKILL_EGRESS_CONNECT_TIMEOUT_SECONDS:-10}
      SKILL_EGRESS_IDLE_TIMEOUT_SECONDS: ${SKILL_EGRESS_IDLE_TIMEOUT_SECONDS:-30}
      # These are acceptance ceilings, not ambient grants. Every executor and
      # Claude Turn still signs its own smaller/equal per-scope budget. Keep
      # the defaults large enough for the longest admitted Claude Turn.
      SKILL_EGRESS_MAX_TUNNEL_SECONDS: ${SKILL_EGRESS_MAX_TUNNEL_SECONDS:-14400}
      SKILL_EGRESS_MAX_REQUESTS: ${SKILL_EGRESS_MAX_REQUESTS:-8192}
      SKILL_EGRESS_MAX_OUTBOUND_BYTES: ${SKILL_EGRESS_MAX_OUTBOUND_BYTES:-67108864}
      SKILL_EGRESS_MAX_RESPONSE_WIRE_BYTES: ${SKILL_EGRESS_MAX_RESPONSE_WIRE_BYTES:-2147483648}
      SKILL_EGRESS_MAX_POLICY_SCOPE_ENTRIES: ${SKILL_EGRESS_MAX_POLICY_SCOPE_ENTRIES:-65536}
      SKILL_EGRESS_POLICY_SCOPE_TTL_SECONDS: ${SKILL_EGRESS_POLICY_SCOPE_TTL_SECONDS:-86400}
      SKILL_EGRESS_REQUIRE_POLICY_V3: "1"
      # Four homogeneous executor slots expose at most eight bridge
      # connections each. Keep the global proxy ceiling equal to that fixed
      # topology so one execution cannot consume every proxy worker.
      SKILL_EGRESS_MAX_CONCURRENT_CONNECTIONS: ${SKILL_EGRESS_MAX_CONCURRENT_CONNECTIONS:-32}
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - skill_egress_proxy_socket:/run/chatds-skill-egress
      # Private CA/leaf keys never enter any executor mount.
      - skill_egress_proxy_private:/var/lib/chatds-skill-egress-private
    networks:
      - browser_egress
    healthcheck:
      test: ["CMD", "python", "-I", "/app/server.py", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Build-only member of the opt-in Claude Code profile. The actual Turn
  # containers are created by the trusted Supervisor and always use
  # network_mode:none; this one-shot service merely makes `compose up --build`
  # produce the pinned runtime image before the Supervisor becomes healthy.
  claude-runner-image:
    profiles:
      - claude-code
    image: chat_ds-claude-runner:2.1.152
    build:
      context: .
      dockerfile: claude_runner/Dockerfile.runner
      args:
        SESSION_SANDBOX_IMAGE: chat_ds-session-sandbox
        CLAUDE_CODE_VERSION: 2.1.152
    restart: "no"
    depends_on:
      executor:
        # This is an image-build dependency, not a request-path dependency.
        # Requiring health here can deadlock an opt-in Claude deployment on an
        # unrelated pre-existing Legacy executor healthcheck even though the
        # immutable sandbox base image was built successfully.
        condition: service_started
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # This build-only /usr/bin/true container executes no model input. The
      # current host kernel rejects stacking no-new-privileges with a loaded
      # seccomp BPF program (errno 524), so keep NNP and disable only seccomp.
      - seccomp=unconfined
    entrypoint: ["/usr/bin/true"]
    command: []

  # Trusted control plane only. Backend never receives the Docker socket and
  # per-Turn containers never join chat_net or browser_egress.
  claude-runner-supervisor:
    profiles:
      - claude-code
    image: chat_ds-claude-runner-supervisor
    build:
      context: .
      dockerfile: claude_runner/Dockerfile.supervisor
    container_name: chat_acits_claude_runner_supervisor
    restart: unless-stopped
    depends_on:
      claude-runner-image:
        condition: service_completed_successfully
      skill-egress-proxy:
        condition: service_healthy
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Supervisor is trusted control plane and executes no model-authored
      # command. See the host-kernel compatibility note above.
      - seccomp=unconfined
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-chat-ds-internal-token}
      SKILL_EGRESS_POLICY_TOKEN: ${EXECUTOR_V2_AUTH_TOKEN:-}
      SHAIENGINE_BASE_URL: ${SHAIENGINE_BASE_URL:-https://api.shaiengine.com/v1}
      SHAIENGINE_API_KEY: ${SHAIENGINE_API_KEY:-}
      DEEPSEEK_PRO_BASE_URL: ${DEEPSEEK_PRO_BASE_URL:-http://10.10.132.2:1025/v1}
      DEEPSEEK_PRO_API_KEY: ${DEEPSEEK_PRO_API_KEY:-EMPTY}
      QWEN3_5_BASE_URL: ${QWEN3_5_BASE_URL:-http://10.10.132.128:1025/v1}
      QWEN3_5_API_KEY: ${QWEN3_5_API_KEY:-EMPTY}
      CLAUDE_PROVIDER_PRIVATE_ORIGIN_ALLOWLIST: >-
        ${CLAUDE_PROVIDER_PRIVATE_ORIGIN_ALLOWLIST:-http://10.10.132.2:1025,http://10.10.132.128:1025}
      # backend_protocol attests the existing ChatDS/Legacy model catalog.
      # Every Claude Turn below still uses ANTHROPIC_BASE_URL and the native
      # /v1/messages route; both local providers expose that facade.
      CLAUDE_PROVIDER_PROFILES_JSON: >-
        {"shaiengine":{"backend_base_url":"${SHAIENGINE_BASE_URL:-https://api.shaiengine.com/v1}","api_key_env":"SHAIENGINE_API_KEY","backend_protocol":"openai","models":["glm-5.2","deepseek-v4-pro"]},"local_agentmodel":{"backend_base_url":"${DEEPSEEK_PRO_BASE_URL:-http://10.10.132.2:1025/v1}","api_key_env":"DEEPSEEK_PRO_API_KEY","backend_protocol":"openai","models":["AgentModel"]},"local_qwen":{"backend_base_url":"${QWEN3_5_BASE_URL:-http://10.10.132.128:1025/v1}","api_key_env":"QWEN3_5_API_KEY","backend_protocol":"openai","models":["qwen3_5"]}}
      CLAUDE_WORKSPACE_HOST_ROOT: /nfs/temp/chat_ds
      CLAUDE_RUNNER_STATE_ROOT: /var/lib/chatds-claude-runner
      CLAUDE_RUNNER_IMAGE: chat_ds-claude-runner:2.1.152
      CLAUDE_EGRESS_PROXY_VOLUME_NAME: ${SKILL_EGRESS_PROXY_VOLUME_NAME:-chat_ds_skill_egress_proxy_socket}
      CLAUDE_WORKSPACE_LOCK_VOLUME_NAME: ${WORKSPACE_MUTATION_LOCK_VOLUME_NAME:-chat_ds_workspace_mutation_locks}
      CLAUDE_RUNNER_MAX_CONCURRENT: ${CLAUDE_RUNNER_MAX_CONCURRENT:-4}
      CLAUDE_RUNNER_MAX_RUN_SECONDS: ${CLAUDE_RUNNER_MAX_RUN_SECONDS:-14400}
      CLAUDE_RUNNER_MEMORY_LIMIT: ${CLAUDE_RUNNER_MEMORY_LIMIT:-6g}
      CLAUDE_RUNNER_CPUS: ${CLAUDE_RUNNER_CPUS:-4}
      # The Turn image has every setuid/setgid bit and file capability removed
      # and is attested by label. This host-compatible mode retains the compact
      # seccomp denylist; network=none and exact proxy policy are unchanged.
      CLAUDE_RUNNER_SECURITY_MODE: ${CLAUDE_RUNNER_SECURITY_MODE:-seccomp_stripped_setid}
      CLAUDE_EGRESS_MAX_REQUESTS: ${CLAUDE_EGRESS_MAX_REQUESTS:-8192}
      CLAUDE_EGRESS_MAX_OUTBOUND_BYTES: ${CLAUDE_EGRESS_MAX_OUTBOUND_BYTES:-67108864}
      CLAUDE_EGRESS_MAX_RESPONSE_WIRE_BYTES: ${CLAUDE_EGRESS_MAX_RESPONSE_WIRE_BYTES:-2147483648}
      # Supervisor validates its signed Turn budgets against the exact proxy
      # ceilings during startup, so an override cannot defer a mismatch until
      # the first user request as a generic 403.
      CLAUDE_EGRESS_POLICY_MAX_REQUESTS: ${SKILL_EGRESS_MAX_REQUESTS:-8192}
      CLAUDE_EGRESS_POLICY_MAX_OUTBOUND_BYTES: ${SKILL_EGRESS_MAX_OUTBOUND_BYTES:-67108864}
      CLAUDE_EGRESS_POLICY_MAX_RESPONSE_WIRE_BYTES: ${SKILL_EGRESS_MAX_RESPONSE_WIRE_BYTES:-2147483648}
      BROWSER_PRIVATE_ORIGIN_ALLOWLIST: ${BROWSER_PRIVATE_ORIGIN_ALLOWLIST:-}
      WORKSPACE_MUTATION_LOCK_ROOT: /run/chatds-workspace-lock-plane/locks
      WORKSPACE_MUTATION_LOCK_REQUIRE_MOUNTPOINT: "1"
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /nfs/temp/chat_ds:/nfs/temp/chat_ds
      - claude_runner_state:/var/lib/chatds-claude-runner
      - type: volume
        source: workspace_mutation_locks
        target: /run/chatds-workspace-lock-plane
        volume:
          nocopy: true
    # The Supervisor needs only Backend control-plane reachability. Keep it on
    # an internal bridge so even this Docker-socket-owning trusted component
    # has no ambient Internet route.
    networks:
      - claude_control_net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8030/health',headers={'X-Internal-Token':os.environ['INTERNAL_API_TOKEN']}); raise SystemExit(0 if urllib.request.urlopen(r,timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    stop_grace_period: 10s

  # A one-shot, networkless permission initializer is retained even though a
  # brand-new volume copies the sidecar image's ownership metadata.  It also
  # makes upgrades safe when the named volume already exists with root:root
  # ownership from an older deployment.  Reuse the locally-built browser
  # image so production startup never depends on pulling a utility image from
  # an external registry.
  browser-socket-init:
    image: chat_ds-browser
    pull_policy: never
    container_name: chat_acits_browser_socket_init
    restart: "no"
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 65532:65532 /run/chat-ds-browser && chmod 0700 /run/chat-ds-browser"]
    volumes:
      - browser_cdp_socket:/run/chat-ds-browser

  browser:
    image: chat_ds-browser
    build:
      context: ./browser_sidecar
    container_name: chat_acits_browser
    restart: unless-stopped
    init: true
    depends_on:
      browser-socket-init:
        condition: service_completed_successfully
    user: "65532:65532"
    read_only: true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp:./executor/browser_runtime/seccomp_profile.json
    environment:
      BROWSER_CDP_SOCKET: /run/chat-ds-browser/cdp.sock
      # Optional certificate-scoped exceptions for explicitly allowlisted
      # internal HTTPS origins. Never replace this with a global TLS bypass.
      BROWSER_TLS_SPKI_ALLOWLIST: ${BROWSER_TLS_SPKI_ALLOWLIST:-}
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /dev/shm:size=512m,mode=1777
    volumes:
      - browser_cdp_socket:/run/chat-ds-browser
    networks:
      - browser_egress
    healthcheck:
      test: ["CMD", "python", "-I", "/app/server.py", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 10s

  harness:
    build:
      context: ./harness
    container_name: chat_acits_harness
    restart: unless-stopped
    depends_on:
      executor:
        condition: service_healthy
      executor-2:
        condition: service_healthy
      executor-3:
        condition: service_healthy
      executor-4:
        condition: service_healthy
      browser:
        condition: service_healthy
    environment:
      # Backward-compatible env key; this endpoint serves AgentModel (GLM-5.2).
      DEEPSEEK_PRO_URL: ${DEEPSEEK_PRO_URL:-http://10.10.132.2:1025/v1}
      QWEN3_5_URL: ${QWEN3_5_URL:-http://10.10.132.128:1025/v1}
      SHAIENGINE_BASE_URL: ${SHAIENGINE_BASE_URL:-https://api.shaiengine.com/v1}
      SHAIENGINE_API_KEY: ${SHAIENGINE_API_KEY:-}
      BACKEND_INTERNAL_URL: http://backend:8010
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-chat-ds-internal-token}
      AGENT_DEBUG_TRACE: ${AGENT_DEBUG_TRACE:-true}
      AGENT_DEBUG_TRACE_RESULT_CHARS: ${AGENT_DEBUG_TRACE_RESULT_CHARS:-4000}
      AGENT_DEBUG_TRACE_WORKSPACE: ${AGENT_DEBUG_TRACE_WORKSPACE:-true}
      # Process-local AgentModel admission. The weighted budget is calibrated
      # for this deployment's provider capacity; it is not a Skill threshold.
      PROVIDER_ADMISSION_MAX_INFLIGHT_REQUESTS: ${PROVIDER_ADMISSION_MAX_INFLIGHT_REQUESTS:-3}
      PROVIDER_ADMISSION_MAX_INFLIGHT_ESTIMATED_TOKENS: ${PROVIDER_ADMISSION_MAX_INFLIGHT_ESTIMATED_TOKENS:-240000}
      PROVIDER_ADMISSION_ESTIMATE_SAFETY_FACTOR: ${PROVIDER_ADMISSION_ESTIMATE_SAFETY_FACTOR:-1.10}
      # Zero means wait until ordinary run/batch cancellation.
      PROVIDER_ADMISSION_WAIT_TIMEOUT_SECONDS: ${PROVIDER_ADMISSION_WAIT_TIMEOUT_SECONDS:-0}
      # Per-child no-material-progress lease. Runtime-owned provider-admission
      # waiting is exempt and healthy lifecycle/model/tool progress renews it.
      DELEGATION_BATCH_TIMEOUT_SECONDS: ${DELEGATION_BATCH_TIMEOUT_SECONDS:-3600}
      # Independent async batch hard deadline; neither progress nor admission
      # waiting may extend it. Long operations run in async/sandbox lanes so
      # they do not synchronously block the Harness event loop.
      DELEGATION_BATCH_HARD_TIMEOUT_SECONDS: ${DELEGATION_BATCH_HARD_TIMEOUT_SECONDS:-21600}
      # Absolute ceiling for a stream that continues making real progress.
      # Initial-response and read-stall leases remain independently shorter.
      LLM_STREAM_TOTAL_TIMEOUT_SECONDS: ${LLM_STREAM_TOTAL_TIMEOUT_SECONDS:-14400}
      # Zero-byte provider transport failures have no emitted model state and
      # may be replayed under a separate reconnect budget.  Semantic/API errors
      # retain their short bounded retry policy.
      LLM_PREBYTE_TRANSPORT_RETRY_BUDGET_SECONDS: ${LLM_PREBYTE_TRANSPORT_RETRY_BUDGET_SECONDS:-600}
      LLM_PREBYTE_TRANSPORT_RETRY_MAX_ATTEMPTS: ${LLM_PREBYTE_TRANSPORT_RETRY_MAX_ATTEMPTS:-32}
      # Ordinary standard Skills use the same progressive-disclosure loop as
      # mature Agent-Skills Harnesses. Explicit declarative contracts continue
      # to compile into deterministic DAGs. The legacy model-authored
      # capability-plan gate remains available only as a rollback switch.
      STANDARD_SKILL_EXECUTION_ENGINE: ${STANDARD_SKILL_EXECUTION_ENGINE:-progressive}
      WEB_SEARCH_PROVIDERS: ${WEB_SEARCH_PROVIDERS:-searxng}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      SEARXNG_TIMEOUT_SECONDS: ${SEARXNG_TIMEOUT_SECONDS:-10}
      BROWSER_PRIVATE_ORIGIN_ALLOWLIST: ${BROWSER_PRIVATE_ORIGIN_ALLOWLIST:-}
      BROWSER_DNS_SYNTHETIC_PUBLIC_RANGES: ${BROWSER_DNS_SYNTHETIC_PUBLIC_RANGES:-}
      # Chromium is reachable only through a dedicated named-volume socket.
      # No CDP port or browser service name exists on chat_net.
      BROWSER_CDP_SOCKET: /run/chat-ds-browser/cdp.sock
      BROWSER_CDP_CONNECT_TIMEOUT_SECONDS: ${BROWSER_CDP_CONNECT_TIMEOUT_SECONDS:-10}
      # Compatibility key intentionally resolves to the same physical sandbox.
      # Runtime feature analysis cannot select a second execution environment.
      SKILL_BROWSER_EXECUTOR_SOCKET: /run/chat-ds-executor/executor.sock
      EXECUTOR_SOCKET: /run/chat-ds-executor/executor.sock
      # Keep Backend and Harness on the same bounded local-flock timeout.
      WORKSPACE_MUTATION_LOCK_TIMEOUT_SECONDS: ${WORKSPACE_MUTATION_LOCK_TIMEOUT_SECONDS:-2}
      # Cross-service coordination must stay on the host-local Docker volume.
      # Session content remains on NFS, but no flock operation may reach it.
      WORKSPACE_MUTATION_LOCK_ROOT: /run/chatds-workspace-lock-plane/locks
      WORKSPACE_MUTATION_LOCK_REQUIRE_MOUNTPOINT: "1"
      # Ordered physical membership is trusted Harness configuration.  Tools
      # and model prompts receive only the content-bound logical pool digest.
      EXECUTOR_POOL_SOCKETS: >-
        /run/chat-ds-executor/executor.sock,/run/chat-ds-executor-2/executor.sock,/run/chat-ds-executor-3/executor.sock,/run/chat-ds-executor-4/executor.sock
      EXECUTOR_V2_AUTH_TOKEN: ${EXECUTOR_V2_AUTH_TOKEN:-}
    group_add:
      - "65533"
    volumes:
      - type: bind
        source: ${CHATDS_DATA_ROOT:?Set CHATDS_DATA_ROOT to the canonical shared host data directory}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${CHATDS_MEMORY_ROOT:?Set CHATDS_MEMORY_ROOT to the canonical host memory directory}
        target: /app/data/memories
        bind:
          create_host_path: false
      - /nfs/temp/chat_ds:/nfs/temp/chat_ds
      - executor_socket:/run/chat-ds-executor:ro
      - executor_socket_2:/run/chat-ds-executor-2:ro
      - executor_socket_3:/run/chat-ds-executor-3:ro
      - executor_socket_4:/run/chat-ds-executor-4:ro
      - browser_cdp_socket:/run/chat-ds-browser:ro
      - type: volume
        source: workspace_mutation_locks
        target: /run/chatds-workspace-lock-plane
        volume:
          nocopy: true
    networks:
      - chat_net
      - search_net
    healthcheck:
      test:
        - CMD
        - python
        - -I
        - -c
        - "import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # Runtime-owned process cleanup can spend up to 60s draining an already
    # dispatched close transaction.  Keep the Harness alive long enough to
    # publish that terminal state before the executor slots are stopped.
    stop_grace_period: 90s

  backend:
    build:
      context: ./backend
    container_name: chat_acits_backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Let detached chat producers record service-shutdown cancellation and
    # finish their durable terminal projection before SIGKILL.
    # Uvicorn stops waiting on live SSE requests after 3s; Backend then has a
    # bounded 3s producer-cancel window plus 8s for terminal projection.
    stop_grace_period: 30s
    depends_on:
      harness:
        condition: service_healthy
      # Optional in Legacy-only deployments; when the claude-code profile is
      # selected this prevents startup reconciliation from racing Supervisor
      # health after a host or Compose restart.
      claude-runner-supervisor:
        condition: service_healthy
        required: false
    environment:
      # SQLite on local Docker volume — NFS locks break aiosqlite
      DATABASE_URL: sqlite+aiosqlite:////app/db/chat_ds.db
      # Override JWT secret in production. Generate with: python -c 'import secrets; print(secrets.token_urlsafe(48))'
      SECRET_KEY: ${SECRET_KEY:-chat-acits-CHANGE-ME-IN-PRODUCTION}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-chat-ds-internal-token}
      # Idle/read boundary: must exceed Harness's four-hour absolute
      # provider-stream ceiling so this outer transport cannot fire first.
      HARNESS_STREAM_TIMEOUT_SECONDS: ${HARNESS_STREAM_TIMEOUT_SECONDS:-18000}
      CLAUDE_CODE_ENGINE_ENABLED: ${CLAUDE_CODE_ENGINE_ENABLED:-false}
      CLAUDE_RUNNER_URL: http://claude-runner-supervisor:8030
      CLAUDE_RUNNER_STREAM_TIMEOUT_SECONDS: ${CLAUDE_RUNNER_STREAM_TIMEOUT_SECONDS:-18000}
      CLAUDE_CODE_PROVIDER_PROFILES: >-
        ["shaiengine","local_agentmodel","local_qwen"]
      # Primary AgentModel (GLM-5.2) and auxiliary multimodal endpoint.
      DEEPSEEK_PRO_BASE_URL: ${DEEPSEEK_PRO_BASE_URL:-http://10.10.132.2:1025/v1}
      DEEPSEEK_PRO_API_KEY: ${DEEPSEEK_PRO_API_KEY:-EMPTY}
      QWEN3_5_BASE_URL: ${QWEN3_5_BASE_URL:-http://10.10.132.128:1025/v1}
      QWEN3_5_API_KEY: ${QWEN3_5_API_KEY:-EMPTY}
      SHAIENGINE_BASE_URL: ${SHAIENGINE_BASE_URL:-https://api.shaiengine.com/v1}
      SHAIENGINE_API_KEY: ${SHAIENGINE_API_KEY:-}
      AGENT_DEBUG_TRACE: ${AGENT_DEBUG_TRACE:-true}
      AGENT_EVENT_IMMEDIATE_PERSIST: ${AGENT_EVENT_IMMEDIATE_PERSIST:-true}
      # Backend UI/upload/bootstrap mutations share Harness's local lock plane.
      # Contention is retryable and bounded so an API request cannot hang.
      WORKSPACE_MUTATION_LOCK_TIMEOUT_SECONDS: ${WORKSPACE_MUTATION_LOCK_TIMEOUT_SECONDS:-2}
      WORKSPACE_MUTATION_LOCK_ROOT: /run/chatds-workspace-lock-plane/locks
      WORKSPACE_MUTATION_LOCK_REQUIRE_MOUNTPOINT: "1"
      WORKSPACE_ORPHAN_LOCK_TIMEOUT_SECONDS: ${WORKSPACE_ORPHAN_LOCK_TIMEOUT_SECONDS:-0.25}
      WORKSPACE_ORPHAN_RECONCILE_LIMIT: ${WORKSPACE_ORPHAN_RECONCILE_LIMIT:-256}
      WORKSPACE_ORPHAN_RECONCILE_INTERVAL_SECONDS: ${WORKSPACE_ORPHAN_RECONCILE_INTERVAL_SECONDS:-60}
    volumes:
      - type: bind
        source: ${CHATDS_DATA_ROOT:?Set CHATDS_DATA_ROOT to the canonical shared host data directory}
        target: /app/data
        bind:
          create_host_path: false
      - chat_ds_db:/app/db
      - /nfs/temp/chat_ds:/nfs/temp/chat_ds
      - type: volume
        source: workspace_mutation_locks
        target: /run/chatds-workspace-lock-plane
        volume:
          nocopy: true
    networks:
      - chat_net
      - claude_control_net
    # Backend health includes a cross-container /app/data inode attestation
    # against Harness.  This catches relative bind mounts rebased by a clean
    # archive deployment before Frontend accepts user traffic.
    healthcheck:
      test:
        - CMD
        - python
        - -I
        - -c
        - "import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    # Backend is not exposed externally — nginx in frontend container proxies
    # to it via the chat_net Docker network. Uncomment for direct debugging:
    # ports:
    #   - "8010:8010"

  frontend:
    build:
      context: ./frontend
    container_name: chat_acits_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chat_net

networks:
  chat_net:
    driver: bridge
  # Backend-to-Claude-Supervisor control plane only. ``internal`` removes the
  # default egress route; Turn containers themselves still use network=none.
  claude_control_net:
    driver: bridge
    internal: true
  # Egress-only browser network.  Harness/backend/frontend are deliberately
  # absent, so a compromised renderer cannot resolve or dial chat_net peers.
  browser_egress:
    driver: bridge
  # Stable, application-owned source range for SearXNG limiter pass-listing.
  # Only the search stack and trusted Harness join this network.
  search_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.250.0/24

volumes:
  chat_ds_db:
    driver: local
  executor_socket:
    driver: local
  executor_socket_2:
    driver: local
  executor_socket_3:
    driver: local
  executor_socket_4:
    driver: local
  workspace_mutation_locks:
    driver: local
    name: ${WORKSPACE_MUTATION_LOCK_VOLUME_NAME:-chat_ds_workspace_mutation_locks}
  skill_egress_proxy_socket:
    driver: local
    name: ${SKILL_EGRESS_PROXY_VOLUME_NAME:-chat_ds_skill_egress_proxy_socket}
  skill_egress_proxy_private:
    driver: local
  browser_cdp_socket:
    driver: local
  claude_runner_state:
    driver: local
  searxng_data:
    driver: local
  searxng_valkey_data:
    driver: local
