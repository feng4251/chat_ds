  - name: external_database_skills
    source: available_skills
    skills:
      - clinicaltrials-database   # Completed/ongoing trial designs, eligibility criteria, endpoint benchmarks
      - pubmed-database           # Published efficacy/safety/preclinical/target biology literature
      - fda-database              # FDA labels, approval letters, AdCom briefings, Medical Reviews
      - gene-database             # HGNC gene symbol standardization, variant nomenclature (HGVS)
      - cosmic-database           # Somatic mutation prevalence and pathogenicity
      - clinvar-database          # Germline variant clinical significance
      # ── v2.2 newly wired skills ──
      - drugbank-database         # Drug info, targets, mechanisms, DDI, pharmacology for 9,591 drugs
      - opentargets-database      # Target-disease associations, tractability, genetic evidence, known drugs
      - chembl-database           # Bioactivity data (IC50/Ki/EC50), SAR, 2M+ compounds
      - uniprot-database          # Protein structure, domains, PTMs, isoforms, GO terms, ID mapping
      - string-database           # PPI networks, GO/KEGG enrichment, interaction partners, 59M+ proteins
      - kegg-database             # Pathway maps, drug-pathway links, metabolic pathways
      - reactome-database         # Reaction pathway enrichment, complementary to KEGG
      - openalex-database         # 240M+ scholarly works, citation analysis, trends, author/institution networks
      - gwas-database             # SNP-trait associations (GWAS Catalog), genetic validation of targets
    description: "External database skills available for Knowledge Gate searches and Worker use. v2.2: Expanded from 7 to 14 skills covering target biology (UniProt/STRING/KEGG/Reactome), pharmacology (DrugBank/ChEMBL), disease genetics (OpenTargets/GWAS), and literature intelligence (OpenAlex)."

# ── Final Report Template ──
final_report_template:
  sections:
    - section: "Executive Summary"
      order: 1
      content: "1-page summary of all key findings, critical issues, and recommended actions"

    - section: "PICO Analysis & Regulatory Standards Compliance"
      order: 2
      source_worker: worker-pico-standards
      key_elements:
        - "PICO extraction table"
        - "Multi-agency compliance matrix (ICH/FDA/EMA/NMPA)"
        - "Deviation list with severity ratings"
        - "Modification suggestions with citations"

    - section: "Competitive Safety & Efficacy Benchmarks"
      order: 3
      source_worker: worker-safety-extraction
      key_elements:
        - "Per-drug/per-trial safety table (AE, SAE, Grade 3+, Top 10 AEs)"
        - "Per-drug/per-trial efficacy table (endpoint-specific)"
        - "Cross-source contradiction log"
        - "Extraction confidence dashboards"

    - section: "Historical Trial Termination & Failure Mode Analysis"
      order: 4
      source_worker: worker-termination-analysis
      key_elements:
        - "Aggregate termination statistics"
        - "Top-3 failure modes with root cause analysis"
        - "Cross-dimensional breakdowns (TA, phase, sponsor, time)"
        - "Design recommendations per phase"

    - section: "Proposed Inclusion/Exclusion Criteria"
      order: 5
      source_worker: worker-ie-criteria
      key_elements:
        - "Complete I/E draft with citations"
        - "Complexity dashboard (FK readability, logic complexity, enrollment impact, diversity impact)"
        - "Risk annotations"
        - "Consistency checks and gap analysis"

    - section: "Biomarker-Guided Patient-Trial Matching Results"
      order: 6
      source_worker: worker-biomarker-matching
      applicability: "Only when patient_matching task_type is triggered"
      key_elements:
        - "Ranked patient-trial match list with scores"
        - "Per-pair variant-level annotation (matching, missing, excluding, confounding)"
        - "Evidence gaps (untested biomarkers)"
        - "Per-patient top-3 trials and per-trial top-5 patients"

    - section: "Adverse Event Adjudication Results"
      order: 7
      source_worker: worker-ae-adjudication
      applicability: "Only when ae_adjudication or safety_review task_type is triggered"
      key_elements:
        - "Per-case MedDRA coding (LLT → PT → SOC)"
        - "CTCAE v5.0 grade determinations with supporting evidence"
        - "Seriousness assessment (ICH E2A SAE criteria)"
        - "Quality flags (under-reporting, grade discrepancies, missing related AEs)"

    - section: "ICH-Mandated Supplementary Analyses"
      order: 8
      source_worker: worker-pico-standards
      applicability: "When ich_supplementary task_type is triggered or comprehensive_design is requested"
      key_elements:
        - "Estimand Framework (ICH E9(R1)) — all 5 attributes specified"
        - "QTc / TQT Assessment (ICH E14) — recommended strategy and monitoring plan"
        - "MRCT Design Audit (ICH E17) — regional balance, ethnic factors, bridging"
        - "Risk-Based Quality Management (ICH E6(R2)) — CtQ factors, QTLs, monitoring strategy"
        - "Pediatric Investigation Plan (ICH E11) — deferral/waiver assessment"
        - "Statistical Rigor Check — sample size, multiplicity, interim analysis, missing data"

    - section: "Trial Simulation & Statistical Analysis"
      order: 9
      source_worker: worker-pico-standards
      applicability: "When statistical_simulation task_type is triggered or comprehensive_design is requested"
      key_elements:
        - "Monte Carlo power analysis — simulated vs analytical power comparison"
        - "Power curve analysis — N vs. power, N_min for 80%/90% power"
        - "Sample size re-estimation — analytical vs. simulation-based required N"
        - "I/E criteria impact — Restrictive/Standard/Broad scenarios on enrollment and power"
        - "Effect size sensitivity — cliff-edge analysis, dropout sensitivity"
        - "Endpoint type comparison — continuous vs. binary vs. TTE efficiency"
        - "Operating characteristics — Type I error, bias, RMSE, CI coverage"
        - "Comparative design recommendations — ranked scenarios with evidence"

    - section: "Comprehensive AE Profile & Management Plan"
      order: 10
      source_worker: worker-ae-adjudication
      applicability: "When ae_profile_generation task_type is triggered or comprehensive_design is requested"
      key_elements:
        - "Drug-specific AE incidence tables (overall, most common, AESIs, lab abnormalities)"
        - "CTCAE v5.0 grading tables per organ system with management actions"
        - "AE management algorithm (universal + AE-specific protocols)"
        - "Phase-specific risk mitigation (Phase I/II/III/IV)"
        - "Pharmacovigilance & SAE reporting guidelines"
        - "Competitive AE benchmarking vs drug class comparators"

    - section: "Recruitment Funnel & Enrollment Optimization"
      order: 11
      source_worker: worker-ie-criteria
      applicability: "When recruitment_funnel task_type is triggered or comprehensive_design is requested"
      key_elements:
        - "5-stage screening funnel model with pass rates per stage"
        - "Screen failure bottleneck analysis (Top-3 reasons)"
        - "Enrollment velocity projection by site and month"
        - "Recruitment risk score (GREEN/YELLOW/RED/CRITICAL)"
        - "Mitigation strategies with expected impact"
        - "Enrollment monitoring plan with remediation triggers"

    - section: "Conflict Resolution Log"
      order: 12
      content: "All contradictions found, resolution strategies applied, and adopted values"

    - section: "Knowledge Gaps & Recommendations"
      order: 13
      content: "Cumulative gap inventory across all Workers + cross-Worker prioritized recommendations"

    - section: "Target Biology & Preclinical Evidence"
      order: 15
      source_worker: worker-target-biology
      applicability: "When target_biology or comprehensive_design task_type is triggered"
      key_elements:
        - "Protein structure & domain architecture (UniProt)"
        - "Signaling pathway networks with evidence confidence scores (STRING/KEGG/Reactome)"
        - "Drug-target pharmacology (ChEMBL bioactivities, DrugBank known drugs)"
        - "Disease association evidence (OpenTargets + GWAS + ClinVar)"
        - "Preclinical evidence matrix (KO/transgenic/scRNA-seq/in vitro)"
        - "Target risk assessment (novelty, genetic validation, druggability, safety concerns)"

    - section: "Competitive Landscape & Differentiation Strategy"
      order: 16
      source_worker: worker-competitive-landscape
      applicability: "When competitive_landscape or comprehensive_design task_type is triggered"
      key_elements:
        - "Competitive comparison matrix (6-15 competitors across approved/Phase III/Phase II)"
        - "Efficacy & safety benchmarks with forest plot data"
        - "Mechanistic differentiation analysis"
        - "Development precedence and regulatory history"
        - "Treatment guideline alignment"
        - "IP landscape and publication trends"

    - section: "Literature Synthesis & Evidence Map"
      order: 17
      source_worker: worker-literature-synthesis
      applicability: "When literature_synthesis or comprehensive_design task_type is triggered"
      key_elements:
        - "Structured citation index with evidence grading (Oxford CEBM 1A-5)"
        - "Evidence-by-claim analysis with supporting/conflicting citations"
        - "Citation graph with cluster analysis (by research theme)"
        - "Thematic analysis with maturity assessment (Emerging/Established/Declining)"
        - "Research trends (publications by year, top institutions/authors, growth rate)"
        - "Identified knowledge gaps with severity grading and resolution suggestions"

    # ── v2.3 新增: 5 级生物标志物策略 ──
    - section: "Integrated Biomarker Strategy"
      order: 14
      source_worker: worker-pico-standards
      applicability: "Always included in comprehensive_design"
      key_elements:
        - "Tier 1 — 诊断/富集: Amyloid PET, CSF Aβ42/Aβ40, CSF p-Tau181 (确保纳入明确病理患者)"
        - "Tier 2 — 靶点结合/PD: CSF 游离靶点 (靶点占位), CSF IL-1β, CSF sTREM2 (确证通路调控)"
        - "Tier 3 — 疾病进展: CSF/血浆 NfL, p-Tau217, 海马体积 (sMRI) (监测疾病修改效应)"
        - "Tier 4 — 安全性: 脑 MRI (ARIA 系列), ADA/NAb (安全性监查)"
        - "Tier 5 — 探索性: CSF YKL-40, GFAP, Tau PET, FDG-PET (扩展机制理解)"
        - "采样时间表: CSF/血浆/影像生物标志物的完整访视矩阵 (Screening→W78)"

    - section: "Appendix: Source Citations"
      order: 18
      content: "All PMIDs, NCTs, FDA/EMA document IDs, ICH guideline references, and database accessions used across all Workers"

    # ── v2.3 新增: 应急方案 ──
    - section: "Pandemic & Operational Contingency Plan"
      order: 19
      applicability: "Always included in comprehensive_design"
      key_elements:
        - "访视中断: 窗口期扩展至 ±6 周 (正常 ±2 周)；居家评估 (远程 CDR, 远程 MMSE)"
        - "区域封锁: 按地区分层，基于地区的亚组分析"
        - "药物中断: 缺失数据模型纳入中断时长作为协变量"
        - "远程评估: 预定义的远程与面访评估等效性分析 (Kappa/ICC ≥ 0.8)"
        - "数据完整性: 电子源数据 (eSource) 和去中心化试验 (DCT) 要素的预整合"

    # ── v2.3 新增: 附录缩写表 ──
    - section: "Appendix: Abbreviations & Glossary"
      order: 20
      content: "Auto-generated comprehensive abbreviation table covering all therapeutic area terms, CDISC codes, regulatory acronyms, biomarker names, and statistical terminology used across all Workers' outputs"

  # ── v2.3 新增: 报告叙述质量指令 ──
  narrative_quality_instructions: |
    在聚合最终报告时，必须遵循以下叙述质量规则：

    1. **段落间过渡**: 每个 Part 的结尾必须有 1-2 句过渡到下一个 Part，
       解释两个 Part 之间的逻辑关系（例："以上靶点生物学证据直接支持了
       下一节中 Phase I 起始剂量的选择"）。

    2. **表格伴随文字**: 每个表格前后必须有至少 2 句解释性文字——
       表前说明"这个表展示什么、为什么重要"，
       表后说明"从表中我们可以得出什么结论"。

    3. **数据来源标注**: 每个数据表格必须在表注中标注数据来源
       （格式: "数据来源: [数据库名/PMID/NCT], 查询日期: [YYYY-MM-DD]"）。

    4. **决策者摘要**: Part C (竞争格局) 和 Part G (Phase III) 之后
       必须包含一段 150-200 字的中文摘要，用非专业语言解释核心决策含义。

    5. **缩写首次使用**: 每个缩写词在首次出现在正文中时必须展开全称，
       并在附录缩写表中列出。