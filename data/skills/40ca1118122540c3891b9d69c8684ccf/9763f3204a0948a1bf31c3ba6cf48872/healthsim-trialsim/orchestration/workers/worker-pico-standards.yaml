    source: skill:fda-database
    description: "Search FDA guidance documents for disease-specific trial design requirements"

  - name: pubmed_search
    source: skill:pubmed-database
    description: "Search for disease-specific trial design standards, endpoint validation, and regulatory publications"

  - name: clinicaltrials_query
    source: skill:clinicaltrials-database
    description: "Retrieve comparable real-world trials for benchmarking: same indication, phase, design"

  - name: domain_knowledge
    source: project
    paths:
      - clinical-trials-domain.md
      - phase1-dose-escalation.md
      - phase2-proof-of-concept.md
      - phase3-pivotal.md
      - therapeutic-areas/oncology.md
      - therapeutic-areas/cardiovascular.md
      - therapeutic-areas/cns.md
      - therapeutic-areas/cgt.md
    description: "Reference ICH/FDA/EMA regulatory framework and phase/therapeutic-area-specific design rules"

  - name: web_search
