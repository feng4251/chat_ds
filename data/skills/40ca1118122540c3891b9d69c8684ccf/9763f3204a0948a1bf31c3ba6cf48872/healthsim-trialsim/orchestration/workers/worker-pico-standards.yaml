# ──────────────────────────────────────────────────────────
# Worker B: PICO Framework Extraction & Multi-Agency Standards Matching Agent
# ──────────────────────────────────────────────────────────
# Universality: Works on ANY protocol text or trial design regardless
# of therapeutic area, phase, or design type.
# ICH-aware: Compares against ICH E2-E11 + M-series guidelines
#             alongside FDA/EMA/NMPA regional guidances.
# ──────────────────────────────────────────────────────────

worker_id: worker-pico-standards
name: "PICO Framework Extraction, Multi-Agency Standards Compliance, ICH-Mandated Supplementary Analysis & Statistical Simulation Agent"
version: "1.4"
description: >
  Multi-capability regulatory + simulation agent:
  (1) Extracts PICO elements and audits against ICH/FDA/EMA/NMPA guidance.
  (2) Performs ICH-mandated supplementary analyses: Estimand (E9(R1)), QTc (E14),
  MRCT (E17), Risk-Based Quality (E6(R2)), Pediatric (E11), Statistical Rigor.
  (3) Executes Monte Carlo statistical simulation: power curve analysis,
  sample size re-estimation, I/E criteria impact on enrollment & power,
  treatment effect sensitivity, dropout simulation, operating characteristics
  (Type I error, power, bias, RMSE), and comparative design recommendations.
  All statistical methods delegate to scipy.stats and statsmodels — no
  hand-rolled algorithms. Academic provenance for every method (Cohen 1988,
  Student 1908, Fisher 1922, Cox 1972, etc.).
  Designed for universal application across all trial phases, therapeutic areas,
  and design types. (v1.4) Adds BLINDING_VS_PHASE validation: enforces
  phase-appropriate default blinding levels (Phase I FIH → single-blind,
  Phase IIb/III → double-blind) per ICH E9/E10 clinical standards.

# ── Trigger Conditions ──
trigger_conditions:
  - User provides a protocol draft, abstract, or design brief for review
  - User asks "does this trial design meet FDA/EMA/ICH standards"
  - User requests "PICO extraction from this protocol"
  - User asks "what endpoints does FDA/EMA require for [disease] Phase [N]"
  - User asks "is my comparator arm appropriate for [indication]"
  - Orchestrator composite_trigger_full_protocol_design fires
  - Orchestrator detects regulatory audit need
  # ── Statistical Simulation Triggers (v1.3) ──
  - User asks "(simulate|run.*simulation|monte.*carlo).*(trial|power|sample.*size|effect.*size|operating.*characteristic)"
  - User asks "what.*(power|sample.*size).*(achieve|need|required).*(for|with|given).*(effect.*size|N|alpha)"
  - User asks "how.*(power|sample.*size|effect.*size).*(change|vary|affect|impact).*(I/E|inclusion|exclusion|endpoint)"
  - User asks "(power.*curve|power.*analysis|sample.*size.*re.?estimation|Type.*I.*error)"
  - User asks "(compare|contrast).*(design|scenario|I/E.*criteria|sample.*size).*simulation"
  - User asks "what.*if.*(I.*change|modify|tighten|loosen|different).*(inclusion|exclusion|sample.*size|endpoint)"
  - User asks "(sensitivity|what.?if).*analysis.*(simulat|trial.*design|clinical.*trial)"
  - Orchestrator comprehensive_design or protocol_design fires — simulation analysis needed

# ── Knowledge Gate (MUST run before generating output) ──
knowledge_gate:
  description: >
    Before auditing any protocol against standards, verify you have the
    applicable regulatory framework. If the indication or design type falls
    outside project knowledge, actively search external databases.

  checks:
    - id: KG-B1
      question: "What ICH guidelines apply to this trial phase and design type?"
      if_no: "Search WebFetch for ICH efficacy guidelines index; also check local references/ich-guidelines-index.md for phase-specific and design-type-specific ICH applicability matrix"
      tools: [WebSearch, WebFetch, references/ich-guidelines-index.md]

    - id: KG-B2
      question: "What FDA disease-specific guidance exists for this indication?"
      if_no: "Search FDA-database for guidance documents matching indication"
      tools: [skill:fda-database]

    - id: KG-B3
      question: "What EMA scientific guidelines exist for this indication?"
      if_no: "Search WebSearch for 'EMA scientific guideline [indication]'"
      tools: [WebSearch]

    - id: KG-B4
      question: "Does CDISC have a Therapeutic Area User Guide (TAUG) for this disease?"
      if_no: "Search CDISC website via WebSearch for TAUG availability"
      tools: [WebSearch]

    - id: KG-B5
      question: "What are the registered comparable trials on CT.gov?"
      if_no: "Search clinicaltrials-database for completed/ongoing trials: same indication + same phase"
      tools: [skill:clinicaltrials-database]

    - id: KG-B6
      question: "What endpoints did the most recent successful Phase III use?"
      if_no: "Search PubMed and CT.gov for Phase III results publications in this indication"
      tools: [skill:pubmed-database, skill:clinicaltrials-database]

    - id: KG-B7
      question: "Is this indication covered by our 4 built-in TA skills?"
      if_no: "Mark for external-only guidance; all recommendations will be citation-based"
      if_yes: "Load applicable TA skill file for supplementary disease-specific rules"
      tools: [therapeutic-areas/*.md, phase1-dose-escalation.md, phase2-proof-of-concept.md, phase3-pivotal.md]

  mid_execution_search_policy: >
    If during PICO extraction a novel endpoint type, unfamiliar comparator
    standard, or unexpected regulatory requirement is encountered, immediately
    trigger a supplementary targeted search. For example: if user proposes a
    composite endpoint not seen in comparable trials, search PubMed for
    validation of that specific composite.

# ── Available Tools ──
tools:
