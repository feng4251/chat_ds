- id: session-title-llm
  disabled: true

- id: session-telemetry-otel
  disabled: true

# The upstream headless runner deliberately creates a random one-shot Session.
# ChatDS owns the Web/Session boundary, so replace only that direct driver with
# a stable native-Session driver. The upstream agent loop, checkpoints,
# compaction, tools, subagents, retries, and terminal semantics stay mounted.
- id: headless-runner
  disabled: true

- id: approval
  config:
    policy: !!js "process.env.DSH_PERMISSION_MODE === 'danger-full-access' ? 'never' : 'ask'"

- id: user-questions
  config:
    provider: chatds-control-bridge

- id: agent-default-model
  config:
    provider: !!js process.env.CHATDS_DSH_PROVIDER_ROUTE
    model: !!js process.env.CHATDS_DSH_MODEL

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max
    maxTokens: !!js Number(process.env.CHATDS_DSH_MAX_OUTPUT_TOKENS)
    defaultContextWindow: !!js Number(process.env.CHATDS_DSH_CONTEXT_WINDOW)
    streamIdleTimeoutMs: 7200000
    models:
      - id: !!js process.env.CHATDS_DSH_MODEL
        name: !!js process.env.CHATDS_DSH_MODEL
        contextWindow: !!js Number(process.env.CHATDS_DSH_CONTEXT_WINDOW)
        maxTokens: !!js Number(process.env.CHATDS_DSH_MAX_OUTPUT_TOKENS)

# A provider whose maximum-reasoning level has a non-DeepSeek wire spelling
# uses DSH's native generic OpenAI-compatible adapter. The agent still selects
# canonical `max`; only the exact provider spelling is translated as profile
# data. Providers using the native `max` dialect stay on llm-deepseek above.
- id: llm-pi-ai
  config:
    providers:
      chatds-openai-compatible:
        displayName: ChatDS OpenAI-Compatible
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DEEPSEEK_BASE_URL
        compat:
          thinkingFormat: deepseek
          supportsReasoningEffort: true
        reasoning: max
        defaultContextWindow: !!js Number(process.env.CHATDS_DSH_CONTEXT_WINDOW)
        defaultMaxTokens: !!js Number(process.env.CHATDS_DSH_MAX_OUTPUT_TOKENS)
        streamIdleTimeoutMs: 7200000
        models:
          - id: !!js process.env.CHATDS_DSH_MODEL
            name: !!js process.env.CHATDS_DSH_MODEL
            contextWindow: !!js Number(process.env.CHATDS_DSH_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.CHATDS_DSH_MAX_OUTPUT_TOKENS)
            reasoningEfforts:
              max: !!js process.env.CHATDS_DSH_REASONING_WIRE_EFFORT

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE
    workspaceRoot: !!js process.cwd()

# Do not replace the upstream permission-presets config: patch configs replace
# whole objects, and the native table includes the read-only preset. The
# sandbox and approval defaults above let DSH infer and durably pin the exact
# native preset for each new Session.

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: ['/skill-view/plugin/skills']
    watch: false

- id: web
  config:
    searchProvider: chatds-searxng

- id: web-search-deepseek
  disabled: true

- id: tool-web
  config:
    search: true
    fetch: false
    searchTimeoutMs: 60000

- insert:
    - id: chatds-searxng-search
      name: /opt/chatds-deepseek-plugins/searxng_provider.mjs
      config:
        endpoint: !!js process.env.CHATDS_SEARXNG_SEARCH_URL

    # Headless mounts the native question service but no model-facing question
    # tool. The Web adapter supplies only the answer channel for this upstream
    # tool; DSH still owns the request and continuation lifecycle.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: chatds-event-bridge
      name: /opt/chatds-deepseek-plugins/event_bridge.mjs

    # Provider-wire compatibility only. Agent planning, tool dispatch,
    # retries, compaction, and termination remain upstream DSH-owned.
    - id: chatds-provider-compat-bridge
      name: /opt/chatds-deepseek-plugins/provider_compat_bridge.mjs

    - id: chatds-control-bridge
      name: /opt/chatds-deepseek-plugins/control_bridge.mjs

    # A selected declarative Skill route is projected as one root-scoped tool.
    # The tool executes through DSH's own workflow engine and native subagents;
    # without a per-Turn projection this plugin is a no-op.
    - id: chatds-native-skill-workflow
      name: /opt/chatds-deepseek-plugins/native_workflow.mjs

    # Artifact completion stays inside the same native Turn. The gate reads a
    # root-owned pre-Turn frontier, allows one bounded native continuation,
    # and leaves the authoritative terminal audit to PID 1.
    - id: chatds-native-artifact-gate
      name: /opt/chatds-deepseek-plugins/native_artifact_gate.mjs

    - id: chatds-session-driver
      name: /opt/chatds-deepseek-plugins/session_driver.mjs
