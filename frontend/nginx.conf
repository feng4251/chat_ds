log_format chatds_stream
    '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
    'status=$status bytes=$body_bytes_sent request_id=$request_id '
    'request_time=$request_time upstream_status=$upstream_status '
    'upstream_response_time=$upstream_response_time pipe=$pipe';

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bigger uploads (images can be base64-data-URLs >1MB in chat bodies)
    client_max_body_size 25m;

    # Gzip static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The application shell and build descriptor must always revalidate.
    # Fingerprinted /assets remain immutable below.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /build-info.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # SPA fallback — any unknown path returns the non-cacheable shell.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Long-lived assets get cached
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend container (default: buffered for normal JSON responses)
    location /api/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streaming endpoint — no buffering, long timeouts
    location /api/chat/completions {
        access_log /var/log/nginx/access.log chatds_stream;
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_buffering off;
        proxy_cache off;
        # These are idle transport bounds, not whole-workflow durations. Keep
        # them above Backend→Harness (5h), which in turn stays above the
        # Harness provider-stream absolute ceiling (4h).
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        proxy_set_header Connection "";
    }
}
